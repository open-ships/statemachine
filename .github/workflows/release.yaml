name: Release

# A successful CI run on the current main commit is the only release path.
# VERSION sets the next deliberate baseline; later releases increment patch.
on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

# Version selection and tag creation must be serialized so concurrent CI runs
# cannot choose the same patch version.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: >-
      ${{
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_repository.full_name == github.repository
      }}
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout successful CI commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Select release version
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --tags

          # A retry after tag creation but before GitHub release publication
          # must finish that release instead of consuming another patch number.
          EXISTING_TAG=$(git tag --points-at HEAD --list 'v*.*.*' --sort=-version:refname | head -n 1)
          if [ -n "$EXISTING_TAG" ]; then
            if gh release view "$EXISTING_TAG" >/dev/null 2>&1; then
              echo "HEAD is already released as $EXISTING_TAG; nothing to release."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ "$(git cat-file -t "refs/tags/$EXISTING_TAG")" != "tag" ]; then
              echo "Existing release tag $EXISTING_TAG is not annotated." >&2
              exit 1
            fi
            echo "Resuming unpublished release $EXISTING_TAG."
            echo "tag=$EXISTING_TAG" >> "$GITHUB_OUTPUT"
            echo "tag_exists=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # A newer main build will have its own release run. Do not publish an
          # older untagged commit merely because its slower CI run completed later.
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo "A newer main commit superseded this CI run; nothing to release."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          BASE_VERSION=$(tr -d '[:space:]' < VERSION)
          if ! [[ "$BASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "VERSION must contain a semantic version without a leading v." >&2
            exit 1
          fi

          BASE_TAG="v$BASE_VERSION"
          LATEST=$(git tag --list 'v*.*.*' --sort=-version:refname | head -n 1)
          if [ -z "$LATEST" ] || [ "$(printf '%s\n%s\n' "$LATEST" "$BASE_TAG" | sort -V | tail -n 1)" = "$BASE_TAG" ] && [ "$LATEST" != "$BASE_TAG" ]; then
            TAG="$BASE_TAG"
          else
            TAG=$(awk -F '[v.]' '{printf "v%d.%d.%d", $2, $3, $4 + 1}' <<< "$LATEST")
          fi

          echo "Selected $TAG."
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "tag_exists=false" >> "$GITHUB_OUTPUT"

      - name: Set up exact Go toolchain
        if: ${{ steps.version.outputs.skip != 'true' }}
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.0"

      - name: Verify source
        if: ${{ steps.version.outputs.skip != 'true' }}
        run: |
          go vet ./...
          go run github.com/kisielk/errcheck@v1.20.0 ./...
          go run honnef.co/go/tools/cmd/staticcheck@v0.7.0 ./...
          go test -race -coverprofile=coverage.out ./...
          COVERAGE=$(go tool cover -func=coverage.out | awk '/^total:/ {gsub("%", "", $3); print $3}')
          awk -v coverage="$COVERAGE" 'BEGIN { if (coverage < 90) exit 1 }'
          go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...
          test ! -f go.sum
          test -z "$(gofmt -l .)"

      - name: Build source artifact
        if: ${{ steps.version.outputs.skip != 'true' }}
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: git archive --format=tar.gz --prefix="statemachine-$TAG/" --output=source.tar.gz HEAD

      - name: Record toolchain
        if: ${{ steps.version.outputs.skip != 'true' }}
        run: |
          go version > toolchain.txt
          go env GOOS GOARCH GOVERSION GOTOOLCHAIN >> toolchain.txt
          git rev-parse HEAD >> toolchain.txt

      - name: Generate CycloneDX SBOM
        if: ${{ steps.version.outputs.skip != 'true' }}
        run: go run github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@v1.10.0 mod -json -output sbom.json

      - name: Checksums
        if: ${{ steps.version.outputs.skip != 'true' }}
        run: sha256sum source.tar.gz coverage.out toolchain.txt sbom.json > SHA256SUMS

      - name: Attest SBOM
        if: ${{ steps.version.outputs.skip != 'true' }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: source.tar.gz
          sbom-path: sbom.json

      - name: Create annotated tag
        id: create_tag
        if: ${{ steps.version.outputs.skip != 'true' && steps.version.outputs.tag_exists != 'true' }}
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          # Do not tag an outdated commit if main advanced during verification.
          git fetch origin main --tags
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo "A newer main commit superseded this release during verification."
            echo "superseded=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag --annotate "$TAG" --message "Release $TAG"
          git push origin "refs/tags/$TAG"

      - name: Publish release with retained evidence
        if: ${{ steps.version.outputs.skip != 'true' && steps.create_tag.outputs.superseded != 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release create "$TAG" source.tar.gz coverage.out toolchain.txt sbom.json SHA256SUMS \
            --generate-notes --title "$TAG" --verify-tag
