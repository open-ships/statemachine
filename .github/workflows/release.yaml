name: Release

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: >-
      ${{
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_repository.full_name == github.repository
      }}
    uses: open-ships/ci/.github/workflows/release-go.yaml@e1753d11eefffbc9e4bc05e26927c3893d9605b4 # v1.1.0
    with:
      commit-sha: ${{ github.event.workflow_run.head_sha }}
      project-name: statemachine
      distribution: source
      go-version: 1.26.8
      coverage-floor: 90
      publish-coverage: true
