name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.0"

      - name: Vet
        run: go vet ./...

      - name: Static analysis
        if: runner.os == 'Linux'
        run: |
          go run github.com/kisielk/errcheck@v1.20.0 ./...
          go run honnef.co/go/tools/cmd/staticcheck@v0.7.0 ./...

      - name: Test
        run: go test ./...

      # The remaining checks are properties of the source, not of the platform,
      # so one runner proves them. They also assume a POSIX shell.
      - name: Verify zero dependencies
        if: runner.os == 'Linux'
        run: |
          test ! -f go.sum || (echo "go.sum exists; this module must have zero dependencies" && exit 1)

      - name: Formatting
        if: runner.os == 'Linux'
        run: test -z "$(gofmt -l .)"

      - name: Race detector
        if: runner.os == 'Linux'
        run: go test -race -coverprofile=coverage.out ./...

      - name: Enforce coverage floor
        if: runner.os == 'Linux'
        shell: bash
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | awk '/^total:/ {gsub("%", "", $3); print $3}')
          awk -v coverage="$COVERAGE" 'BEGIN { if (coverage < 90) exit 1 }'

      - name: Retain coverage evidence
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-${{ github.sha }}
          path: coverage.out

      - name: Vulnerability scan
        if: runner.os == 'Linux'
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...

      - name: Benchmarks
        if: runner.os == 'Linux'
        run: go test -run=NONE -bench=. -benchtime=10x ./...
