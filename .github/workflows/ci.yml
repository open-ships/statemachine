name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    uses: open-ships/ci/.github/workflows/check-go.yaml@95d4b3ed5452a99525c240688de146553e57cee0 # shared CI v1.2.0 candidate
    with:
      runner: ${{ matrix.os }}
      static-analysis: ${{ matrix.os == 'ubuntu-latest' }}
      artifact-name: source-assurance-${{ github.sha }}
      artifact-path: |
        coverage.out
        benchmark.out
      command: |
        if [ "$RUNNER_OS" = Linux ]; then
          ./scripts/check.sh
          ./scripts/benchmark.sh
        else
          ./scripts/check.sh test
        fi
      artifact-enabled: ${{ matrix.os == 'ubuntu-latest' }}

  toolchain-compatibility:
    strategy:
      fail-fast: false
      matrix:
        include:
          - go: 1.26.0
            purpose: minimum
          - go: 1.27.1
            purpose: current
    name: Go ${{ matrix.go }} (${{ matrix.purpose }})
    uses: open-ships/ci/.github/workflows/check-go.yaml@95d4b3ed5452a99525c240688de146553e57cee0 # shared CI v1.2.0 candidate
    with:
      go-version: ${{ matrix.go }}
      cache-dependency-path: go.mod
      command: |
        ./scripts/check.sh test

  # Per-change live fuzzing supplements seed execution and the nightly campaign.
  fuzz-smoke:
    uses: open-ships/ci/.github/workflows/check-go.yaml@95d4b3ed5452a99525c240688de146553e57cee0 # shared CI v1.2.0 candidate
    with:
      environment: '{"FUZZTIME":"20s"}'
      failure-artifact-name: fuzz-smoke-failures-${{ github.sha }}
      failure-artifact-path: '**/testdata/fuzz/**'
      command: |
        ./scripts/fuzz.sh
