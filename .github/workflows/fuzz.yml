name: Fuzz campaign

# Promote every failing input to a permanent regression seed alongside its fix.
# The ordinary Go build cache can retain nonfailing discoveries between local
# runs; uploaded failure seeds are the durable, reviewable evidence in CI.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      fuzztime:
        description: "Fuzz time per target (Go duration or iteration count)"
        required: false
        default: "5m"

permissions:
  contents: read

env:
  GOTOOLCHAIN: local

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.8"
          cache-dependency-path: go.mod
      - name: Run the campaign
        env:
          FUZZTIME: ${{ inputs.fuzztime || '5m' }}
        run: ./scripts/fuzz.sh
      - name: Retain failing inputs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-failures-${{ github.sha }}
          path: '**/testdata/fuzz/**'
          if-no-files-found: ignore
