name: Fuzz campaign

# Promote every failing input to a permanent regression seed alongside its fix.
on:
  schedule:
    - cron: 17 3 * * *
  workflow_dispatch:
    inputs:
      fuzztime:
        description: Fuzz time per target (Go duration or iteration count)
        required: false
        default: 5m

permissions:
  contents: read

jobs:
  fuzz:
    uses: open-ships/ci/.github/workflows/check-go.yaml@95d4b3ed5452a99525c240688de146553e57cee0 # shared CI v1.2.0 candidate
    with:
      timeout-minutes: 340
      environment: |-
        {"FUZZTIME":${{ toJSON(inputs.fuzztime || '5m') }}}
      failure-artifact-name: fuzz-failures-${{ github.sha }}
      failure-artifact-path: '**/testdata/fuzz/**'
      command: |
        ./scripts/fuzz.sh
