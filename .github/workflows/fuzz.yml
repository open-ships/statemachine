name: Fuzz campaign

# A sustained nightly fuzz campaign over every target in the module, in the
# spirit of continuous fuzzing: short per-change smoke runs live in ci.yml,
# while this workflow gives each target minutes of wall time every night and
# on demand. A failing input is uploaded and must be added to the package's
# testdata/fuzz corpus as a permanent regression seed alongside the fix.

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      fuzztime:
        description: "Fuzz time per target (Go duration)"
        required: false
        default: "5m"

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.0"

      - name: Run the campaign
        shell: bash
        run: |
          set -euo pipefail
          FUZZTIME="${{ github.event.inputs.fuzztime || '5m' }}"
          failed=0
          for pkg in $(go list ./...); do
            for target in $(go test -list '^Fuzz' "$pkg" | grep '^Fuzz' || true); do
              echo "::group::$pkg $target ($FUZZTIME)"
              if ! go test -run '^$' -fuzz "^${target}\$" -fuzztime "$FUZZTIME" "$pkg"; then
                failed=1
              fi
              echo "::endgroup::"
            done
          done
          exit "$failed"

      - name: Retain failing inputs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-failures-${{ github.sha }}
          path: |
            **/testdata/fuzz/**
          if-no-files-found: ignore
